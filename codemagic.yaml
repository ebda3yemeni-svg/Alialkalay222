workflows:
  android-workflow:
    name: Mayar Genealogy Android
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: 22
      java: 21

      vars:
        VITE_API_BASE_URL: "https://service-9582.ai.studio"

    scripts:

      - name: Install packages
        script: |
          npm install

      - name: Build web
        script: |
          npm run build

      - name: Prepare Capacitor
        script: |
          npm install @capacitor/android @capacitor/cli

          npx cap init "Mayar Genealogy" "com.mayar.genealogy" --web-dir dist || true

          npx cap add android || true

          npx cap sync android

      - name: Fix Gradle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          cd ..

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk
