workflows:
  android-workflow:
    name: Android App Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        VITE_API_BASE_URL: "https://service-9582.ai.studio"
      node: 20
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Web Assets
        script: |
          npm run build
      - name: Setup Capacitor & Android Platform
        script: |
          if [ ! -d "android" ]; then
            npm install @capacitor/core @capacitor/cli @capacitor/android
            npx cap init "Genealogy App" "com.genealogy.app" --web-dir dist
            npx cap add android
          else
            npx cap copy android
          fi
          npx cap sync android
      - name: Fix Kotlin Dependency Conflicts
        script: |
          echo "" >> android/variables.gradle
          echo "ext.kotlinVersion = '1.8.22'" >> android/variables.gradle
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
                  }
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          details.useVersion '1.8.22'
                      }
                  }
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF
      - name: Verify Java and Gradle Environment
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          javac -version
          cd android
          chmod +x gradlew
          ./gradlew --version
      - name: Build Android APK
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          export PATH="$JAVA_HOME/bin:$PATH"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
